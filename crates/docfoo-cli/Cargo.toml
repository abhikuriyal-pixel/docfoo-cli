[package]
name = "docfoo-cli"
description = "Barebones DocFoo CLI for scripts and the Hermes Slack agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "docfoo"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
ctrlc = "3"
docfoo-kg = { path = "../docfoo-kg" }
docfoo-ocr = { path = "../docfoo-ocr" }
flate2 = "1"
regex = "1"
rpassword = "7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
