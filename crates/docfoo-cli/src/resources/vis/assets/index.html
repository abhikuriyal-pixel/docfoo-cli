<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocFoo resources</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236E6233' d='M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/katex/katex.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body data-theme="art-deco">
  <header class="res-header">
    <div class="res-title">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
        <path d="M4 5.5v15"/><path d="M9 7h7M9 11h7"/>
      </svg>
      <strong>DocFoo</strong>
      <span class="res-title-sep">·</span>
      <span class="res-title-sub">Resources</span>
    </div>
    <div class="res-header-controls">
      <span id="res-status" class="res-status" role="status" aria-live="polite"></span>
      <button id="theme-toggle" class="control-btn" type="button" title="Toggle theme">Art Deco</button>
    </div>
  </header>

  <main class="res-main">
    <div id="crumbs" class="breadcrumbs"></div>
    <section id="browser-pane" class="res-pane">
      <div class="resources-scroll">
        <div class="level-header">
          <div class="level-heading">
            <h2 id="level-title">Resources</h2>
            <p id="level-desc" class="level-desc"></p>
          </div>
          <div class="level-actions">
            <button id="dice" class="control-btn" type="button" title="Shuffle covers" aria-label="Shuffle covers"></button>
          </div>
        </div>
        <p id="browser-error" class="res-error" hidden></p>
        <div id="grid" class="card-grid"></div>
        <p id="empty" class="empty-state" hidden></p>
      </div>
    </section>

    <section id="viewer-pane" class="res-pane" hidden>
      <div id="tabs" class="res-tabs" role="tablist" hidden></div>
      <div class="chapter-viewer">
        <div class="chapter-header">
          <div class="chapter-header-info">
            <h1 id="doc-title">Document</h1>
          </div>
          <div class="chapter-actions">
            <button id="toc-toggle" class="control-btn" type="button">Outline</button>
            <button id="notes-toggle" class="control-btn" type="button">Notes</button>
            <div class="font-slider-wrapper" title="Reader text size">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
              <input type="range" min="12" max="45" step="1" value="20" class="font-slider" id="font-slider" aria-label="Reader text size">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            </div>
            <div class="font-slider-wrapper" title="Figure size">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
              <input type="range" min="25" max="100" step="1" value="65" class="font-slider" id="figure-slider" aria-label="Figure size">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </div>
          </div>
        </div>
        <div class="chapter-layout">
          <aside id="toc" class="chapter-toc" hidden>
            <div class="toc-head">Outline<span id="toc-count" class="toc-meta"></span></div>
            <nav id="toc-list" class="toc-list" aria-label="Outline"></nav>
          </aside>
          <div id="doc-body" class="file-content-body">
            <p id="doc-error" class="res-error" hidden></p>
            <div id="doc-md" class="markdown-content"></div>
          </div>
          <aside id="notes-panel" class="chapter-notes" hidden>
            <div class="notes-panel">
              <div class="notes-panel-head">Notes<span id="notes-count" class="toc-meta"></span></div>
              <p id="notes-empty" class="notes-empty">Select text in the document and choose <strong>Note</strong> to jot one down. Notes appear here and in the desktop app.</p>
              <div id="notes-list" class="notes-panel-list"></div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="annotation-toolbar" class="annotation-toolbar" hidden>
    <button id="annotate-note" type="button">✎ Note</button>
  </div>

  <div id="note-popover" class="note-popover" role="dialog" aria-label="Note" hidden>
    <div class="popover-head">
      <span id="popover-title">New note</span>
      <button id="popover-close" class="icon-btn" type="button" title="Close" aria-label="Close">×</button>
    </div>
    <p id="popover-quote" class="popover-quote" hidden></p>
    <textarea id="note-text" rows="4" placeholder="Write a note…"></textarea>
    <p id="popover-error" class="note-error" hidden></p>
    <div class="popover-actions">
      <button id="note-cancel" type="button">Cancel</button>
      <button id="note-save" class="primary" type="button">Save</button>
    </div>
  </div>

  <div id="lightbox" class="res-lightbox" hidden>
    <img id="lightbox-img" alt="">
  </div>

  <script src="/katex/katex.min.js"></script>
  <script src="/katex/contrib/auto-render.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
